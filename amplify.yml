version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        # Fallback when yarn.lock is absent or out of date (Atlas adds maplibre-gl).
        - yarn install --frozen-lockfile || yarn install
        - npx puppeteer browsers install chrome
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - ~/.cache/puppeteer/**/*
