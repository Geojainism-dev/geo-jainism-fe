# nginx only inherits add_header from a parent context when the child
# location defines NO add_header of its own — several locations below set
# their own Cache-Control, so the security headers are repeated in each of
# those blocks rather than declared once at the server level. (A single
# server-level `add_header` block would silently stop applying to any
# location that adds its own header — see the map below instead: define
# once, reference everywhere via $security_headers isn't a real nginx
# feature, so the explicit repetition is the correct fix here.)

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Non-root nginx (see Dockerfile) can't write the default PID/log paths
    # outside what's already chowned — access/error logs stay on the
    # container's stdout/stderr via the base image's default symlinks.

    server_tokens off;

    # absolute_redirect off + port_in_redirect off stop nginx's automatic
    # directory-slash redirect (used nowhere below, but kept as a safety net
    # for any future `location` that relies on it) from leaking the
    # container's internal listen port into the Location header — that port
    # is almost never the one a client actually connected through once
    # there's a docker -p mapping, reverse proxy, or ingress in front.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # Local liveness check for HEALTHCHECK / orchestrator probes — doesn't
    # touch the SPA shell or any backend.
    location = /health {
        access_log off;
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 200 "ok\n";
    }

    # Vite's hashed build assets (content-addressed filenames) are safe to
    # cache forever — a new deploy ships new filenames, never a mutated one.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker must always be revalidated, or clients can get
    # stuck on a stale cached version indefinitely.
    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else: serve the matching prerendered file when one exists
    # (/, /tamil-jain, /about each have a real dist/**/index.html — see
    # scripts/prerender.mjs), otherwise fall through to the SPA shell for
    # client-side routing. Never cache HTML itself.
    #
    # `$uri/index.html` (not the bare `$uri/` nginx normally uses here) is
    # deliberate: matching a request like /tamil-jain against the directory
    # `$uri/` triggers nginx's automatic 301-to-trailing-slash behavior,
    # which — see absolute_redirect above — can't be trusted to know what
    # port/host the client actually used. Trying the literal index.html file
    # instead serves it directly with a 200, no redirect involved.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }

    error_page 404 /index.html;
}
